<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #173b38;
        background: #fbf8f3;
        font-family: "Microsoft JhengHei", sans-serif;
      }
      .texture {
        position: absolute; inset: 0; opacity: .25;
        background-image: radial-gradient(circle at 20% 30%, rgba(22,91,85,.1) 0 2px, rgba(22,91,85,0) 3px);
        background-size: 38px 38px;
      }
      .orb { position: absolute; right: -160px; top: -180px; width: 620px; height: 620px; border-radius: 50%; background: #e7c8b4; }
      .copy { position: absolute; left: 72px; top: 68px; width: 760px; z-index: 3; }
      .pill { display:inline-block; margin-bottom: 28px; padding: 11px 22px; color:#fbf8f3; background:#165b55; border-radius:99px; font-size:25px; font-weight:700; }
      h1 { margin:0; max-width: 760px; font-size: 82px; line-height:1.12; letter-spacing:-.055em; }
      h1 span { color:#9b5438; }
      .sub { margin-top:28px; font-size:30px; font-weight:800; }
      .detail { margin-top:18px; color:#334944; font-size:25px; font-weight:700; }
      .portrait { position:absolute; right:78px; bottom:0; width:380px; height:625px; z-index:2; object-fit:contain; object-position:bottom; }
      .logo { position:absolute; right:62px; top:50px; width:106px; height:106px; z-index:4; border:4px solid #fbf8f3; border-radius:20px; object-fit:cover; }
      .rule { position:absolute; left:72px; bottom:48px; width:720px; height:7px; background:#d6a94d; }
    </style>
  </head>
  <body>
    <div class="texture"></div><div class="orb"></div>
    <div class="copy">
      <div class="pill">2026 高雄成人培訓</div>
      <h1>高雄NGH<br /><span>100小時培訓</span></h1>
      <div class="sub">8個實體日＋視訊期末報告</div>
      <div class="detail">國立高雄大學推廣教育中心正式招生</div>
    </div>
    <img class="portrait" src="../assets/images/instructor-tsai-hui-ting.png" alt="" />
    <img class="logo" src="../assets/images/reset-hypnosis-academy-logo.jpg" alt="" />
    <div class="rule"></div>
  </body>
</html>
